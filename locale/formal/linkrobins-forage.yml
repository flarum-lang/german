linkrobins-forage:
  admin:
    at_limit: "Dein Suchserver enthält {indexed} Beiträge, was dem Limit deines Tarifs ({cap}) entspricht. Neuere Beiträge werden nicht hinzugefügt und erscheinen daher nicht in den Suchergebnissen. Durch ein Upgrade deines Tarifs wird das Limit erhöht.\n"
    check_again: 'Noch einmal überprüfen'
    connected: "✓ Verbunden – Suchanfragen in deinem Forum werden von deinem eigenen Suchserver beantwortet.\n"
    connected_indexed: "✓ Verbunden – Suchanfragen in deinem Forum werden von deinem eigenen Suchserver beantwortet, auf dem {indexed} Beiträge gespeichert sind.\n"
    error: "Forage konnte die Einrichtung nicht abschließen. Die Suchfunktion deines Forums funktioniert weiterhin, sodass für deine Mitglieder keine Beeinträchtigungen besteht. Versuche bitte, deinen Schlüssel erneut zu speichern, und melde dich bei uns, falls das Problem weiterhin auftritt.\n"
    error_still_connected: "Forage konnte diesen Schlüssel nicht überprüfen, daher wurde er nicht verwendet. Dein Forum durchsucht weiterhin mittels des bisherigen Schlüssels, sodass weiterhin alles wie gewohnt funktioniert. Versuche erneut zu speichern und melde dich, falls das Problem weiterhin auftritt.\n"
    index_empty: "Dein Schlüssel ist in Ordnung, aber dein Suchserver enthält überhaupt keine Daten, sodass Suchanfragen in diesem Forum keine Ergebnisse liefern. Wenn du gerade eine Verbindung hergestellt oder das Forum neu aufgebaut hast, ist der Index noch dabei, sich zu füllen, und das Problem wird sich in Kürze von selbst beheben. Falls nicht, führe auf deinem Server den Befehl „php flarum forage:reindex“ aus, um den Index anhand der Beiträge deines Forums neu zu erstellen. In jedem Fall ist nichts verloren gegangen: Deine Beiträge befinden sich in der Datenbank deines Forums, und der Index wird daraus erstellt.\n"
    index_short: "Ihr Suchserver enthält {indexed} Beiträge, und in diesem Forum sind {expected} Beiträge, die dort hinein gehören. Wenn du dich gerade erst angemeldet hast oder viele Beiträge auf einmal verfasst wurden, ist der Server noch dabei, den Rückstand aufzuholen, und die Situation wird sich von selbst normalisieren. Sollte die Diskrepanz bestehen bleiben, führe den Befehl „php flarum forage:reindex“ aus, um den Index neu zu erstellen.\n"
    invalid: "Dieser Schlüssel wurde nicht erkannt. Bitte überprüfe, ob du ihn vollständig eingegeben hast und ob dein Forage-Abonnement noch aktiv ist. In der Zwischenzeit wird die Suchfunktion deines Forums verwendet.\n"
    invalid_still_connected: "Dieser Schlüssel wurde nicht erkannt und daher noch nicht verwendet. Überprüfe bitte, ob du ihn vollständig kopiert hast und ob dein Forage-Abonnement noch aktiv ist. Dein Forum sucht weiterhin mittels dem vorherigen Schlüssel, daher funktioniert alles weiterhin wie gewohnt.\n"
    key_help: "Füge den Schlüssel aus deinem Linkrobins.com-Dashboard → Forage ein. Das war’s schon – Forage richtet die Verbindung zu deinem Suchserver für dich ein und beginnt mit der Indizierung deiner Beiträge. Lasse das Feld leer, um zur eigenen Suche deines Forums zurückzukehren.\n"
    key_label: Forage-Schlüssel
    provisioning: "Dein Schlüssel ist in Ordnung, und dein Suchserver wird gerade noch eingerichtet. Das dauert nach der Anmeldung ein oder zwei Minuten. Bis er bereit ist, wird die Suchfunktion deines Forums verwendet.\n"
    related_composer_help: "Wenn ein Mitglied eine neue Diskussion startet, werden unter dem Titelfeld einige bereits vorhandene Diskussionen mit ähnlichen Titeln angezeigt. Das ist nur ein Vorschlag: Es hindert niemanden daran, einen neue Diskussion zu verfassen, und Benutzer können diese Anzeige ausblenden.\n"
    related_composer_label: 'Ähnliche Diskussionen vorschlagen, während jemand schreibt'
    related_discussion_help: "Fügt am Ende der Seite eine kurze Liste weiterer Diskussionen hinzu, die der gerade gelesenen ähneln. Deaktiviere diese Funktion, wenn du das Ende eines Threads lieber frei halten möchtest.\n"
    related_discussion_label: 'Unter jedem Thread verwandte Diskussionen anzeigen'
    unconfigured: "Füge unten deinen Forage-Schlüssel ein, um die gehostete Suche zu aktivieren. Du findest ihn in deinem linkrobins.com-Dashboard unter „Forage“. Bis dahin nutzt dein Forum weiterhin die eigene Suchfunktion, sodass in der Zwischenzeit keine Probleme auftreten.\n"
    unreachable: "Deine Konfiguration ist in Ordnung, aber dein Suchserver antwortet derzeit nicht. In der Zwischenzeit wird die foreneigene Suche verwendet, sodass die Mitglieder weiterhin suchen können.\n"
