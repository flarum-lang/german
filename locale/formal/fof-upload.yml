        anonymize_description: 'Entfernt den Benutzerbezug aus den hochgeladenen Dateien. Die Dateien selbst bleiben für Nutzer zugänglich, die sie vor der Anonymisierung sehen konnten.'
        delete_description: 'Löscht alle Dateien, die der Nutzer hochgeladen hat.'
        export_description: 'Alle vom Nutzer hochgeladenen Dateien.'
fof-upload:
  admin:
    help_texts:
      client_extension: "Standardmäßig wählt Upload eine sichere Dateierweiterung basierend auf dem MIME-Typ.\nBei einigen Dateitypen, die auf ZIP- oder Binärdaten basieren, kann dies dazu führen, dass generische Erweiterungen statt der erwarteten verwendet werden.\nHier kannst du eine kommagetrennte Liste von Dateierweiterungen eingeben, die genau beibehalten werden sollen.\n"
      composer_buttons: "Standardmäßig sind sowohl die Medienmanager-Schaltfläche als auch die Upload-Schaltfläche sichtbar. Du kannst auch festlegen, dass nur eine Schaltfläche angezeigt wird.\n"
      custom_s3_url: "Verwende diese Einstellung, wenn Sie einen S3-kompatiblen Dienst nutzen, der ein bestimmtes URL-Format erfordert (z. B. Backblaze B2) oder wenn Sie Probleme mit dem Standard-URL-Format haben. In der Regel ist diese Einstellung für die meisten Dienste nicht erforderlich. Achten Sie darauf, dass die URL das Protokoll (https://) enthält und korrekt formatiert ist. Beispiel: https://your-bucket.s3.your-region.backblazeb2.com\n"
      disable-download-logging: "Deaktiviere die Protokollierung aller Downloads, die von Nutzern deines Forums getätigt werden. Wenn du es aktiviert lässt, kannst du die Anzahl der Downloads und andere Metriken in der nahen Zukunft einsehen.\n"
      disable-hotlink-protection: "Der Hotlink-Schutz verhindert das Öffnen von Downloads auf anderen Seiten. Die aktuelle Methode erfordert ein csrf-Token und eine Post-ID.\n"
      download_templates: "Downloadvorlagen sind die Art und Weise, wie Uploads in deinem Forum angezeigt werden, z.B. als Vorschaubilder oder Buttons. Derzeit verfügbar:\n"
      local_cdn: "Optional. Wenn du <code>assets/files</code> über ein CDN bereitstellst, gibst du dessen Basis-URL ein; die Links zu den hochgeladenen Dateien verwenden diese dann.\nLasse das Feld leer, um die Dateien direkt aus deinem Forum bereitzustellen.\n"
      mime_order: "Regeln werden von oben nach unten abgeglichen, und die erste Übereinstimmung hat Vorrang. Platziere daher spezifischere Regeln vor allgemeinen.\n"
      mime_types: "Bitte konfigurieren Sie hier Ihre Zuordnung. Jeder reguläre Ausdruck für einen MIME-Typ wird von einem bestimmten Upload-Adapter und einer bestimmten Download-Vorlage verarbeitet.\nOptional können Sie jedem Eintrag eine Berechtigungsbezeichnung (z. B. „Bilder“, „Videos“) zuweisen, um eine eigene Berechtigung im Berechtigungsraster zu erstellen.\nAuf diese Weise können Sie einschränken, welche Gruppen bestimmte Dateitypen hochladen dürfen – zusätzlich zu der grundlegenden Berechtigung „Dateien hochladen“, die immer erforderlich ist.\n"
      resize: "Wähle aus, ob du die Größe deiner Bilder ändern möchtest, bevor sie hochgeladen werden. Du kannst eine maximale Breite und Höhe in Pixeln wählen. Bei der Größenänderung wird das Seitenverhältnis der Bilder beibehalten.\n"
      s3_acl: "Wird auf jedes hochgeladene Objekt angewendet. Lasse das Feld leer, um die Standardeinstellung des Anbieters zu verwenden (in der Regel „private“).\nVerwende <code>public-read</code>, wenn Dateien direkt aus dem Bucket gelesen werden können müssen.\n"
      s3_acl_unsupported: "{provider} unterstützt keine ACLs. Steuere den öffentlichen Zugriff stattdessen über das Dashboard des Anbieters.\n"
      s3_compatible_storage: "Die folgenden Einstellungen sind nur erforderlich, wenn du S3 kompatiblen Speicher verwendest. Wenn du AWS verwendest, kannst du sie leer lassen.\n"
      s3_endpoint: "Die S3-API-URL des Anbieters – nicht die öffentliche URL deines Buckets. Amazon S3 benötigt keine solche URL.\n"
      s3_instance_profile: "Lasse beide Felder leer, um stattdessen eine IAM-Rolle zu verwenden – dies funktioniert nur auf EC2, ECS oder EKS.\n"
      s3_path_style: "Fügt den Bucket anstelle des Hostnamens in den URL-Pfad ein. Wird von MinIO und Cloudflare R2 benötigt;\nwird automatisch festgelegt, wenn du einen Anbieter auswählst.\n"
      s3_provider: "Durch die Auswahl deines Anbieters werden das Endpunktformat, die Adressierungsart und die ACL-Unterstützung wie unten beschrieben festgelegt.\nWähle „Andere S3-kompatible Anbieter“, falls dein Anbieter nicht aufgeführt ist.\n"
      storage_configure_another: "Es sind weitere Speicherdienste installiert, aber noch nicht eingerichtet. Die Konfiguration eines solchen Dienstes\nhat keinen Einfluss darauf, wo Dateien gespeichert werden, solange du ihn keinem Dateityp zuweist.\n"
      storage_intro: "Hier werden die Dienste angezeigt, die du konfiguriert hast oder die von einem Dateityp verwendet werden. Du kannst einen Dienst einrichten,\nbevor du einen Dateityp darauf verweisen – weise ihn auf der Registerkarte „Dateien“ zu, sobald du bereit bist.\n"
      storage_not_installed: 'Suchst du nach Amazon S3, Cloudflare R2 oder Qiniu? Dafür ist ein zusätzliches Paket erforderlich – siehe <a>Installation von Speicheradaptern</a>.'
      thumbnail_quality: "Kodierungsqualität von 1 bis 100, gilt für WebP- und JPEG-Miniaturansichten. Höhere Werte sorgen für ein schärferes Bild,\nerzeugen jedoch größere Dateien. GIF- und PNG-Miniaturansichten sind verlustfrei und ignorieren diese Einstellung.\nVorhandene Miniaturansichten behalten ihre aktuelle Qualität bei, bis sie mit dem Befehl „backfill“ neu generiert werden.\n"
      thumbnails: "Erstelle beim Hochladen eine verkleinerte Miniaturansicht für Bilder. Die Miniaturansicht wird inline angezeigt.\nDurch Anklicken wird die Originaldatei in voller Auflösung in einem neuen Tab geöffnet. Miniaturansichten\nreduzieren die Bandbreite und das Seitengewicht für Foren mit vielen großen Bildern erheblich.\n"
      watermark: "Wähle aus, ob Bilder beim Hochladen mit einem Wasserzeichen versehen werden sollen. Wasserzeichen werden basierend auf deinen Einstellungen unten hinzugefügt, jedoch nicht bei GIF's.\n"
    inspect-mime:
      description: "FoF Upload verwendet den <a>PHP Mime Detector</a> eine Bibliothek für gängige MIME-Typen und PHP Fileinfo als Fallback.\nDer von Fileinfo zurückgegebene MIME-Wert kann von Server zu Server unterschiedlich sein!\n"
      guessed-extension: 'Standard-Dateierweiterung (wenn das Original nicht auf der Whitelist steht)'
