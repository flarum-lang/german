    min_posts_help: "Ridge annotiert nur Diskussionen, die mindestens diese Anzahl an Beiträgen enthalten. Ein kurzer Thread hat keine Form, die es wert wäre, dargestellt zu werden, und der Leser kann bereits den gesamten Inhalt überblicken.\n"
