      list_style_mobile_label: 'Darstellungsart — Mobil'
      list_style_single_bucket_meta: 'Ein Stern (leer / halb / voll) + Bewertung — selber Ort'
      list_style_single_bucket_title: 'Ein Stern (leer / halb / voll) + Bewertung — hinter dem Titel'
      list_style_single_filled_meta: 'Ein Stern + Bewertung, z. B. ★4.6 — selber Ort'
      list_style_single_filled_title: 'Ein Stern + Bewertung, z. B. ★4.6 — hinter dem Titel'
      poll_interval_help: 'Wie oft eine geöffnete Diskussionsseite in Sekunden nach neuen Bewertungen sucht (5–300, Standardwert 8). Höhere Werte verringern die Serverauslastung im Hintergrund in stark frequentierten Foren; der Bewertungsdurchschnitt wird dabei nur etwas weniger zeitnah aktualisiert. Gilt für die Diskussionsseite – das Bewertungs-Popup behält seine eigene, schnellere Aktualisierungsrate bei.'
      poll_interval_label: 'Intervall für Echtzeit-Aktualisierungen (Sekunden)'
      rate_on_list_help: 'Benutzer können Themen direkt in der Diskussionsliste durch Anklicken der Sterne (mit Vorschau beim Darüberfahren mit der Maus) bewerten, genau wie auf der Diskussionsseite. Wenn diese Funktion deaktiviert ist, wird die Bewertung in der Liste nur zur Information angezeigt. Standardmäßig aktiviert.'
      rate_on_list_label: 'Bewertungen aus der Diskussionsliste zulassen'
      realtime_enabled_help: 'Wenn aktiviert, prüfen Diskussionsseiten im Hintergrund auf Aktualisierungen, sodass die Bewertungen nahezu in Echtzeit aktualisiert werden. Deaktiviere diese Option, um alle Hintergrundabfragen zu unterbinden – die Bewertungen werden dann nur noch durch eine Aktion des Benutzers oder durch das Neuladen der Seite aktualisiert (geringere Serverauslastung). Standardmäßig aktiviert.'
      realtime_enabled_label: 'Echtzeit-Aktualisierung der Bewertungen'
      secondary_disable_all: 'Alle deaktivieren'
      secondary_enable_all: 'Alle aktivieren'
      secondary_solo_help: "Steuert Diskussionen, die NUR mit einem sekundären Tag und keinem primären Tag versehen sind\n(z. B. Ankündigungen, bei denen die Beschränkung der Tag-Anzahl umgangen wurde).\nEine Diskussion kann bewertet werden, wenn mindestens eines ihrer sekundären Tags hier auf „Aktiviert“ gesetzt ist.\nDies ist unabhängig von den oben genannten Überschreibungen für primäre Unter-Tags. Standard: Deaktiviert – aktiviere nur die sekundären Tags, die du für sich allein bewertbar machen möchtest.\n"
      secondary_solo_title: 'Sekundäre Tags, die für sich allein verwendet werden (ohne primäres Tag)'
      show_moderation_controls_help: 'Standardmäßig werden die Optionen „Bewertung deaktivieren“ und „Alle Bewertungen zurücksetzen“ nur dann im ⋮-Menü der Diskussion angezeigt, wenn die Bewertung für dieses Thema sichtbar ist – sie sind ausgeblendet, wenn die Tags die Bewertung dort deaktivieren (die Verwaltung einer ausgeblendeten Bewertung hat keine Auswirkungen). Aktiviere diese Option, um sie immer anzuzeigen – z. B. um Bewertungen bei Themen zu verwalten, bei denen das Widget ausgeblendet ist. Es sind weiterhin die entsprechenden Moderationsberechtigungen erforderlich. Standardmäßig deaktiviert.'
      show_moderation_controls_label: 'Bewertungselemente im Diskussionsmenü immer anzeigen'
      show_on_list_help: 'Die Sternebewertung in der Diskussionsliste (Startseite) anzeigen. Wenn diese Option deaktiviert ist, werden die Bewertungen weiterhin auf der Diskussionsseite angezeigt. Standardmäßig aktiviert.'
      show_on_list_label: 'Bewertung in der Diskussionsliste anzeigen'
      single_clickable_help: 'Wenn aktiviert, wird durch Klicken auf den einzelnen Stern (und die dazugehörige Zahl) die Bewertungsliste in einem Modalfenster geöffnet. Ist diese Option deaktiviert, dient der Stern lediglich zur Anzeige – und bei Themen, die noch keine Bewertung haben, wird gar nichts angezeigt.'
      single_clickable_label: 'Einzelner Stern ist klickbar'
      single_modal_rate_help: 'Zeigt oben im Bewertungs-Modalfenster ein interaktives Bewertungsfeld an, damit Nutzer eine Bewertung abgeben (oder ihre Bewertung ändern) können, ohne die Liste zu verlassen.'
      single_modal_rate_label: 'Bewertung innerhalb des Modals erlauben'
      tag_admin_note: "Flarum gewährt Administratoren standardmäßig ALLE Berechtigungen (einschließlich „Bypass“) – diese Option lässt sich in der unten stehenden Berechtigungsübersicht nicht deaktivieren. Um dies für diese Erweiterung zu steuern, verwende den unten stehenden Gruppenauswähler „Tag-Einschränkungen umgehen“. Der Admin-Bypass ist nur aktiv, wenn die Gruppe „Admin“ ausgewählt ist.\n"
      tag_collapse_all: 'Alle zusammenklappen'
      tag_config_help: "Nur aktiv, wenn die mitgelieferte Tags-Erweiterung aktiviert ist. Wähle für jedes Haupt-Tag eine der folgenden Optionen:\n„Aktiviert“ (Standard – jeder mit der globalen Berechtigung „Bewerten“ kann bewerten),\n„Deaktiviert“ (niemand kann bewerten – es sei denn, sie verfügen über die Umgehungsberechtigung)\noder „Gruppen zulassen“ (nur die ausgewählten Gruppen können bewerten).\nWenn ein Haupt-Tag auf „Aktiviert“ oder „Gruppen zulassen“ gesetzt ist, klappe es auf, um einzelne Unter-Tags zu überschreiben\n(„Geerbt“ = Einstellung des übergeordneten Tags übernehmen).\nWenn eine Diskussion mehrere Tags hat, gilt die LIBERALSTE Einstellung – ein einzelnes „Deaktiviert“-Tag blockiert die Bewertung NICHT, wenn ein anderes Tag der Diskussion diese zulässt. Eine Diskussion ist nur dann nicht bewertbar, wenn ALLE ihre Tags auf „Deaktiviert“ gesetzt sind (Gruppen mit Umgehungsberechtigung können weiterhin bewerten).\n"
      tag_config_label: 'Bewertungsberechtigungen je Tag'
      tag_expand_all: 'Alle erweitern'
      tag_hierarchy_hint: 'Alle tags sind eindimensional (keine Eltern-Tags eingerichtet). Damit erweiterbare Unter-Tags hier angezeigt werden, bearbeite ein Tag in Admin → Tags und lege es als „Eltern-Tag“ fest.'
      tag_no_groups: 'Keine auswählbaren Gruppen verfügbar.'
      tag_overrides_count: '{count} Überschreibung(en)'
      tag_state_disabled: Deaktiviert
      tag_state_enabled: Aktiviert
      tag_state_groups: 'Gruppen erlauben'
      tag_state_inherit: Geerbt
      tags_empty: 'Keine Tags gefunden. Erstelle zuerst Tags in den Tag-Einstellungen.'
      tags_only_secondary: 'Keine Haupt-Tags gefunden. Markiere mindestens ein Tag als Haupt-Tag in Admin → Tags damit es als oberste Karte hier erscheint.'
      tags_unavailable: 'Die Tag-Erweiterung muss installiert und aktiviert sein, um Bewertungsberechtigungen je Tag verwenden zu können.'
      untagged_enabled_help: 'Wenn deaktiviert, wird bei Diskussionen, die überhaupt keine Tags enthalten, kein Bewertungs-Widget angezeigt, und sie können nicht bewertet werden. Dies ist nützlich, wenn du möchtest, dass nur bestimmte Tags bewertet werden können. Standardmäßig aktiviert.'
