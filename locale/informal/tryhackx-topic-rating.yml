      enabled_label: 'Diskussionsbewertung aktivieren'
      hide_disabled_ratings_help: 'Wenn ein Thema nicht mehr bewertet werden kann, weil alle seine Tags deaktiviert sind (z. B. weil ein Tag nach der Bewertung auf „deaktiviert“ umgestellt wurde), wird das Bewertungs-Widget – einschließlich aller vorhandenen Bewertungen – für Benutzer, die nicht bewerten können, vollständig ausgeblendet. Dies verhindert den Missbrauch durch „Bewertung und anschließende Festschreibung der Punktzahl“. Wenn diese Option deaktiviert ist, gelten für solche Themen die oben genannten Anzeigeoptionen. Standardmäßig aktiviert. Nutzer, die bewerten DÜRFEN (z. B. Gruppen mit Ausnahmegenehmigung), sehen es weiterhin.'
