linkrobins-birdseye:
  admin:
    permissions:
      view_stats_label: 'Forum-Statistiken anzeigen'
    settings:
      collect_help: 'Die Erfassung vorübergehend anhalten, ohne die Erweiterung zu deaktivieren. Bereits vorhandene Statistiken werden weiterhin angezeigt.'
      collect_label: 'Analysedaten erfassen'
      country_header_help: 'Der Proxy-Header, der den zweistelligen Ländercode jedes Besuchers enthält – „CF-IPCountry“ bei Cloudflare oder z. B. „X-Country“ von nginx-geoip. Er wird unverändert als vertrauenswürdig angesehen. Gib daher nur einen Header an, den dein Proxy tatsächlich setzt; lasse das Feld leer, wenn du keinen solchen Proxy hast und stattdessen auf das anonymisierte IP-Präfix zurückgreifst.'
      country_header_label: 'Header für „Vertrauenswürdiges Land“'
      geo_ip_prefix_help: 'Wenn kein Proxy-Länder-Header vorhanden ist, wird ein gekürztes IP-Präfix (niemals die vollständige Adresse) im 72-Stunden-Puffer gespeichert, damit die Herkunftsländer lokal ermittelt werden können. Deaktiviere diese Option, um Länderstatistiken für nicht über einen Proxy geleiteten Datenverkehr zu überspringen.'
      geo_ip_prefix_label: 'Ländersuche über anonymisiertes IP-Präfix'
      geoip_db_path_help: 'Vollständiger Pfad auf diesem Server zu einer MaxMind-Länderdatenbank, beispielsweise der kostenlosen Datei „GeoLite2-Country.mmdb“ (die du unter deinem eigenen Konto von maxmind.com herunterladen kannst). Wird nur verwendet, wenn kein vertrauenswürdiger Proxy-Header das Land angibt; jede Auflösung erfolgt lokal auf diesem Server.'
      geoip_db_path_label: 'Datei mit Länderdatenbank (optional)'
      license_key_help: 'Von deinem Birdseye-Abonnement auf linkrobins.com. Ohne Schlüssel erfasst die Erweiterung lediglich grundlegende Tageswerte, und zwar ausschließlich lokal. Durch das Speichern eines Schlüssels wird sofort eine Verbindung zu Birdseye hergestellt, sodass dein Dashboard das Forum innerhalb von Sekunden als verbunden anzeigt.'
      license_key_label: Lizenzschlüssel
      weekly_digest_help: 'Jeden Montag wird den Administratoren per E-Mail eine Zusammenfassung der vergangenen Woche zugesandt – Besucherzahlen, Seitenaufrufe, Beiträge, Neuanmeldungen, beliebteste Diskussionen und beliebteste Suchbegriffe. Der Versand erfolgt über den eigenen Mailer deines Forums; es verlassen keine Daten den Server.'
      weekly_digest_label: 'Wöchentliche E-Mail-Zusammenfassung'
    status_active_seen: '✓ Verbunden – Dein Schlüssel ist aktiv, und Birdseye hat zuletzt am {when} Daten von diesem Forum empfangen.'
    status_active_waiting: '✓ Verbunden – Dein Schlüssel ist aktiv. Dein Forum sendet jeweils die Statistiken eines Tages, daher trifft die erste Datenmenge erst nach Ablauf des heutigen Tages ein.'
    status_bound_elsewhere: 'Dieser Schlüssel wird bereits von einem anderen Forum ({forum}) verwendet. Ein Schlüssel gilt jeweils für ein Forum, daher werden die Statistiken von hier abgelehnt. Verwende einen anderen Schlüssel oder bitte den Support, diesen Schlüssel freizugeben.'
    status_canceled: 'Dieser Schlüssel wurde deaktiviert, sodass keine neuen Statistiken mehr verarbeitet werden. Alle bereits in der Datenbank deines Forums vorhandenen Statistiken bleiben unverändert erhalten. Melde dich über dein Dashboard auf linkrobins.com → Birdseye erneut an.'
    status_incomplete: 'Dein Abonnement ist noch nicht aktiv, in der Regel, weil die erste Zahlung noch nicht eingegangen ist. Dein Forum erfasst in der Zwischenzeit weiterhin lokal die grundlegenden Zahlen. Überprüfe dein Dashboard auf linkrobins.com → Birdseye.'
    status_invalid_key: 'Dieser Schlüssel wurde nicht erkannt. Bitte überprüfe, ob du ihn vollständig kopiert hast und ob er seitdem nicht geändert wurde – eine Änderung des Schlüssels bedeutet, dass du hier den neuen Schlüssel einfügen musst.'
    status_no_key: 'Es wurde noch kein Schlüssel gespeichert. Ohne Schlüssel erfasst diese Erweiterung lediglich grundlegende Tageszahlen in deinem eigenen Forum und sendet keinerlei Daten. Füge unten einen Schlüssel ein, um das vollständige Dashboard zu aktivieren – diesen finden Sie in deinem Dashboard auf linkrobins.com unter „Birdseye“.'
    status_unreachable: 'Ich konnte Birdseye gerade nicht erreichen, daher lässt sich nicht sagen, ob dein Schlüssel funktioniert. Dein Forum erfasst die Statistiken so oder so weiter und sendet sie, sobald es möglich ist.'
