huseyinfiliz-author-moderation:
  admin:
    audit_help: 'Wenn Audit aktiviert ist, werden Änderungen im „Nur-Autor“-Modus protokolliert. Standardmäßige Moderationsmaßnahmen nutzen ihre bestehenden Protokolleinträge.'
    author_only_help: 'Wenn dieser Modus aktiv ist, können nur der Autor der Diskussion und Gruppen mit der Umgehungsberechtigung antworten. Nützlich für persönliche Tagebücher und Fortschrittsprotokolle. Der Lesezugriff bleibt unverändert; Sperren und andere Einschränkungen für Antworten gelten weiterhin.'
    available: Aktiviert
    exemption_help: 'Benutzer mit der Ausnahmegenehmigung sind vor diesen zusätzlichen Autorenberechtigungen geschützt. Administratoren sind automatisch von dieser Regelung ausgenommen. Bestehende Mitarbeiterberechtigungen ermöglichen es weiterhin, ausgenommene Benutzer zu moderieren. Die Ausnahmegenehmigung gewährt keine Berechtigung, in Diskussionen zu antworten, die ausschließlich Autoren vorbehalten sind.'
    lock_help: 'Wenn „Flarum Lock“ aktiviert ist, kann es Autoren gestattet werden, ihre eigenen Diskussionen zu sperren und wieder zu entsperren. Dies gilt auch für Sperren, die von Mitarbeitern verhängt wurden; die Erweiterung verfolgt nicht, wer eine Diskussion gesperrt hat. Der Kern des Systems erlaubt es Benutzern, die eine Sperre verwalten können, in dieser gesperrten Diskussion zu antworten.'
    moderation_help: 'Weisen Sie jedem Autor die Berechtigungen separat unter „Berechtigungen“ zu. Autoren können diese zusätzlichen Berechtigungen nur in den von ihnen gestarteten Diskussionen nutzen. Die Moderation von Antworten umfasst den Zugriff auf ausgeblendete Antworten in diesen Diskussionen. Die Berechtigungen „Dauerhaft löschen“, „Melden“, „Genehmigen“ und „Anheften“ werden nicht gewährt.'
