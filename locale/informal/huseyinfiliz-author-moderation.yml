      author_only_enabled_help: 'Auch Autoren benötigen die Gruppenberechtigung. Durch Deaktivieren dieser Option werden die Einschränkungen ausgesetzt, ohne dass der gespeicherte Modus für Diskussionen zurückgesetzt wird.'
      moderation_enabled: 'Zusätzliche Moderationsberechtigungen für Autoren aktivieren'
      moderation_enabled_help: 'Gruppenberechtigungen legen fest, welche Funktionen die einzelnen Autoren erhalten. Wenn dieser Schalter deaktiviert wird, bleiben die normalen Flarum- und Mitarbeiterberechtigungen unverändert. Der Antwortmodus „Nur für Autoren“ verfügt über einen eigenen Schalter.'
