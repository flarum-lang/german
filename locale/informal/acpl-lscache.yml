acpl-lscache:
  admin:
    cache_enabled_help: 'Auf der <a>Informationsseite</a> erfährst du, wie du den Cache testen kannst. HINWEIS: Wenn du den Cache deaktivierst, werden alle zwischengespeicherten Einträge für diese Seite gelöscht.'
    cache_enabled_label: 'LSCache einschalten'
    cache_exclude_help: 'Ein regulärer Ausdruck pro Zeile: <code>/private</code> trifft auf Pfade die /private irgendwo enthalten, <code>^/private$</code> trifft nur auf exakt /private zu. Abfrageparameter werden ignoriert. Bereits zwischengespeicherte Seiten bleiben verfügbar, bis sie ablaufen oder Sie sie löschen. Um Ausschlüsse sofort anzuwenden, löschen Sie die betroffenen URLs über die Befehlszeilenschnittstelle (CLI) oder löschen Sie alle LSCache-Einträge über das Admin-Cache-Menü.'
    cache_exclude_label: 'Pfade nicht zwischenspeichern'
    clearing_cache_listener_help: 'Wenn deaktiviert, wird der Seitencache nach geringfügigen Änderungen an Assets nicht neu aufgebaut. Zwischengespeicherte Seiten können neu erstellte Assets über dieselben URLs laden, während ein CDN wie Cloudflare möglicherweise weiterhin ältere Versionen aus seinem Cache bereitstellt. Auch Seiteneinstellungen und Erweiterungsdaten bleiben möglicherweise veraltet. Wenn deaktiviert, solltest du den LSCache nach größeren Updates oder Änderungen an Erweiterungen manuell leeren.'
    clearing_cache_listener_label: 'LSCache löschen, wenn der Flarum-Cache geleert ist'
    drop_qs_help: "Gib die Namen der Abfrageparameter ein, die beim Zwischenspeichern ignoriert werden sollen, jeweils einen pro Zeile, zum Beispiel <code>fbclid</code> oder <code>utm*</code>. URLs, die sich nur in diesen Parametern unterscheiden, teilen sich dieselbe zwischengespeicherte Seite. Ignoriere nur Parameter, die den Seiteninhalt nicht verändern. Erfordert LSWS v5.2.3 oder neuer. <a>Erfahre mehr über das Weglassen von Abfragezeichenfolgen</a>.<br></br>\n⚠️ Diese Einstellung führt zu Änderungen an der .htaccess-Datei.\n"
    drop_qs_label: 'Abfragezeichenfolgen löschen'
    permissions:
      purge: '=> acpl-lscache.ref.purge_cache'
    public_cache_ttl_help: 'Gib an, wie lange (in Sekunden) öffentliche Seiten zwischengespeichert werden. Standard sind 604800 Sekunden (eine Woche).'
    public_cache_ttl_label: 'Öffentliche Standard-Cache-TTL'
    purge_all: '=> acpl-lscache.ref.purge_cache'
    purge_modal:
      all_label: 'Alle zwischengespeicherten Seiten'
      empty_list_error: 'Gib mindestens ein Element an.'
      paths_help: 'Eine URL oder Pfad pro Zeile, zum Beispiel <code>{url}/t/allgemein</code> oder <code>/t/allgemein</code>.'
      paths_label: URL
      submit_button: Löschen
      tags_help: 'Gib ein LSCache Tag pro Zeile ein, zum Beispiel <code>discussion_123</code> oder <code>discussions</code>.'
      tags_label: Cache-Tag
      title: '=> acpl-lscache.ref.purge_cache'
      type_label: 'Löschen am'
    purge_on_discussion_update_help: 'Gib die URLs oder Cache-Tags ein, die du löschen möchten, wenn eine Diskussion aktualisiert wird, jeweils eine pro Zeile. Die URL sollte mit <code>/</code> beginnen, z. B. <code>/rankings</code>, und das Cache-Tag sollte mit <code>tag=</code> beginnen, z. B. <code>tag=rankings</code>. Bei mehreren Routen ist es schneller, eine Regel in .htaccess mit einem regulären Ausdruck hinzuzufügen, der Routen markiert, und hier nur dieses Tag einzugeben. <a>Weitere Informationen</a>. Standardmäßig wird der Cache für die Startseite und aktualisierte Diskussionen gelöscht.'
    purge_on_discussion_update_label: 'URLs/Tags löschen, wenn Diskussionen oder Beiträge aktualisiert werden'
    serve_stale_help: 'Wenn zwischengespeicherte Inhalte geleert werden, soll LiteSpeed die zuvor zwischengespeicherte Version bereitstellen, während eine neue Kopie erstellt wird. Dies verringert die Serverauslastung, allerdings werden den Besuchern möglicherweise vorübergehend veraltete Inhalte angezeigt. Ist diese Option deaktiviert, müssen Besucher auf eine neu geladene Seite warten.'
    serve_stale_label: 'Veraltete Inhalte bereitstellen'
    status_codes_cache_help: 'Gib einen HTTP-Statuscode und die Anzahl der Sekunden an, für die diese Seite zwischengespeichert werden soll. Verwende ein Leerzeichen als Trennzeichen. Ein Eintrag pro Zeile.'
    status_codes_cache_label: 'Standard-HTTP-Statuscode-Seite TTL'
    test_failed_alert: 'Es sieht so aus, als würde dein Server LSCache nicht unterstützen. Überprüfe deine Serverkonfiguration. Erkannter Server: <b>{server}</b>, erkannter LiteSpeed-Typ: <b>{type}</b>.'
